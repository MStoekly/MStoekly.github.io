let L = 'en';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T = () => C[L];

/* decorative ASCII preview: deterministic, aria-hidden */
function ascii(seed, cols, rows){
  let s = seed * 9301 + 49297, out = [];
  const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const heights = Array.from({length: Math.ceil(cols / 3)}, () => .25 + rnd() * .65);
  for (let y = 0; y < rows; y++){
    let line = '';
    for (let x = 0; x < cols; x++){
      const h = heights[Math.floor(x / 3)], on = (rows - y) / rows < h && x % 3 !== 2;
      line += on ? (rnd() > .25 ? '#' : ':') : (rnd() > .93 ? '.' : ' ');
    }
    out.push(line);
  }
  return out.join('\n');
}

function chart(){
  const rows = C.analysis.rows, W = 400, H = 236, pad = 24, bh = 14, gap = 6.5, max = Math.log10(1100), x30 = pad + 120 + (Math.log10(30) / max) * (W - pad - 140);
  let g = '';
  rows.forEach((r, i) => {
    const y = 26 + i * (bh + gap), w = (Math.log10(r.n) / max) * (W - pad - 140), thin = r.n < 30;
    g += `<text x="${pad}" y="${y + 11}" fill="#8fb1c8" font-size="11">#${r.r}</text>`
      + `<rect x="${pad + 120}" y="${y}" width="${Math.max(w, 3)}" height="${bh}" fill="${thin ? '#ff6aa8' : '#bfe3f0'}"/>`
      + `<text x="${pad + 124 + w}" y="${y + 11}" fill="#bfe3f0" font-size="11">${r.n}</text>`;
  });
  g += `<line x1="${x30}" y1="14" x2="${x30}" y2="${H - 12}" stroke="#ff6aa8" stroke-dasharray="3 3"/><text x="${x30 + 4}" y="12" fill="#ff6aa8" font-size="11">30</text>`;
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(C.analysis['label_' + L])}">${g}</svg>`;
}

function cycleSvg(){
  const mo = [], wk = [];
  let pts = '', x = 0;
  const step = (w, hi) => { pts += `${x},${hi ? 14 : 42} ${x + w},${hi ? 14 : 42} `; x += w; };
  for (let i = 0; i < 3; i++){ step(30, false); step(8, true); }
  step(14, false);
  for (let i = 0; i < 10; i++){ step(6, false); step(4, true); }
  let grid = '';
  for (let i = 1; i < 10; i++) grid += `<line x1="${i * 20}" y1="0" x2="${i * 20}" y2="56" stroke="#2f4258" stroke-width=".5"/>`;
  $('d-svg').innerHTML = grid + `<polyline points="${pts.trim()}" fill="none" stroke="#bfe3f0" stroke-width="1.6" vector-effect="non-scaling-stroke"/>`;
  $('d-svg').setAttribute('aria-label', T().cycle_label);
}

function render(){
  const t = T();
  document.documentElement.lang = L === 'pt' ? 'pt-BR' : 'en';
  $('b-en').setAttribute('aria-pressed', L === 'en'); $('b-pt').setAttribute('aria-pressed', L === 'pt');
  t.nav.forEach((n, i) => $('n' + i).textContent = n);
  $('ntalk').textContent = t.talk;
  $('h-tag').textContent = t.role + ' // ' + 'BR';
  $('h-h1').innerHTML = t.h1 + '<span class="cursor" aria-hidden="true"></span>';
  $('h-sub').textContent = t.sub; $('h-pk').textContent = t.proof_k; $('h-proof').textContent = t.proof; $('h-lede').textContent = t.lede;
  $('c-live').textContent = t.cta_live + ' →'; $('c-play').textContent = t.cta_play; $('c-cv').textContent = t.cta_cv;
  $('c-cv').href = C.cv[L]; $('f-cv').href = C.cv[L]; $('f-cv').textContent = t.cta_cv;
  $('d-title').textContent = t.subject;
  $('d-rows').innerHTML = t.rows.map(r => `<div class="row"><span class="k">${esc(r[0])}</span><span class="v">${esc(r[1])}</span></div>`).join('');
  $('d-met').innerHTML = t.metrics.map(m => `<div><b>${esc(m[0])}</b><span>${esc(m[1])}</span></div>`).join('');
  $('d-cyc').textContent = t.cycle; cycleSvg();

  $('p-tag').textContent = t.proj_tag; $('p-h2').textContent = t.proj_h2; $('p-sub').textContent = t.proj_sub;
  $('p-grid').innerHTML = C.projects.filter(p => p.show).map((p, i) => {
    const c = p[L], live = p.kind === 'live', open = p.kind === 'open';
    let pv;
    if (live) pv = `<div class="pv live"><pre aria-hidden="true">${ascii(+p.idx, 110, 26)}</pre><span class="cap">Power BI ↗</span><button class="btn m pvbtn" data-u="${p.url}">${esc(t.load_prev)}</button></div>`;
    else if (p.chart) pv = `<div class="pv">${chart()}<span class="cap top">${esc(C.analysis['cap_' + L])}</span></div>`;
    else pv = `<div class="pv"><pre aria-hidden="true">${ascii(+p.idx, 110, 26)}</pre><span class="big">${esc(p.big[L === 'pt' ? 1 : 0])}</span></div>`;
    const title = live ? `<a href="${p.url}" target="_blank" rel="noopener noreferrer">${esc(c.title)}<span class="sr"> (${esc(t.open_dash)}, ${L === 'pt' ? 'abre em nova aba' : 'opens in a new tab'})</span></a>` : esc(c.title);
    let links = '';
    if (live) links += `<a class="btn p go" href="${p.url}" target="_blank" rel="noopener noreferrer">${esc(t.open_dash)} ↗</a>`;
    if (p.press) links += `<a href="${p.press}" target="_blank" rel="noopener noreferrer">${esc(t.press)} ↗</a>`;
    if (p.links) links += p.links.map(k => `<a href="${C.analysis.repo + k.u}" target="_blank" rel="noopener noreferrer">${esc(k[L])} ↗</a>`).join('');
    const kcls = live ? '' : open ? 'vio' : '';
    return `<article class="frame card ${live ? 'link' : ''} ${kcls}">
      <div class="bar"><span>${p.idx} // ${esc(c.sub.split(' · ')[0])}</span><span class="badge ${p.kind}">${esc(t.badge[p.kind])}</span></div>
      ${pv}
      <div class="body"><h3>${title}</h3><div class="st">${esc(c.sub)}</div><p class="t">${esc(c.body)}</p>
      ${links ? `<div class="links">${links}</div>` : ''}<div class="chips">${p.tags.map(x => `<span>${esc(x)}</span>`).join('')}</div></div></article>`;
  }).join('');

  $('l-tag').textContent = t.lab_tag; $('l-h2').textContent = t.lab_h2; $('l-sub').textContent = t.lab_sub;
  $('l-games').innerHTML = C.lab.map((g, i) => {
    const c = t.games[g.id];
    const shot = g.img ? `<img src="${g.img}" width="800" height="594" loading="lazy" alt="">` : `<div class="noimg" aria-hidden="true">${esc(c.title)}</div>`;
    return `<article class="frame card ${g.tone}" id="g-${g.id}">
      <div class="bar"><span>${esc(c.title)}</span><span class="sp" aria-hidden="true"><i></i><i></i><i></i></span></div>
      <div class="screen" id="s-${g.id}">${shot}<button class="btn p coin" data-g="${i}">${esc(t.coin)} ▶</button></div>
      <div class="body"><div class="st">${esc(c.sub)} · ${esc(t.controls)}</div><p class="t">${esc(c.body)}</p>
      <div class="links" id="gl-${g.id}">${g.page ? `<a href="${g.page}" target="_blank" rel="noopener noreferrer">${esc(t.coin_page)} ↗</a>` : ''}</div>
      <div class="soon" id="gs-${g.id}" role="status"></div>
      <div class="chips">${c.stack.map(x => `<span>${esc(x)}</span>`).join('')}</div></div></article>`;
  }).join('');
  document.querySelectorAll('.pvbtn').forEach(b => b.onclick = () => { const pv = b.closest('.pv'); pv.innerHTML = `<iframe src="${b.dataset.u}" title="Power BI" loading="lazy" allowfullscreen></iframe>`; });
  document.querySelectorAll('.coin').forEach(b => b.onclick = () => loadGame(+b.dataset.g));
  $('l-sigh').textContent = t.signals_h;
  $('l-sig').innerHTML = t.signals.map(s => `<article class="frame vio"><div class="bar"><span>${esc(s.k)}</span></div><div class="body"><h3>${esc(s.t)}</h3><p class="t">${esc(s.b)}</p></div></article>`).join('');

  $('e-tag').textContent = t.exp_tag; $('e-h2').textContent = t.exp_h2;
  $('e-list').innerHTML = C.experience.map(j => { const c = j[L];
    return `<article class="job"><div class="dt">${esc(c.date)}</div><div><h3>${esc(c.role)}</h3><div class="org">${esc(c.org)}${c.note ? ' · ' + esc(c.note) : ''}</div><ul>${c.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul></div></article>`; }).join('');

  $('s-tag').textContent = t.skills_tag; $('s-h2').textContent = t.skills_h2;
  $('s-skh').textContent = t.skills_h2; $('s-sk').innerHTML = C.skills[L].map(s => `<span>${esc(s)}</span>`).join('');
  $('s-cth').textContent = t.cert_h2; $('s-ct').innerHTML = C.certs[L].map(s => `<li>${esc(s)}</li>`).join('');
  $('s-edh').textContent = t.edu_h2; $('s-ed').innerHTML = C.education[L].map(s => `<li>${esc(s)}</li>`).join('');
  $('s-lgh').textContent = t.lang_h2; $('s-lg').innerHTML = C.languages[L].map(r => `<li><span>${esc(r[0])}</span><b>${esc(r[1])}</b></li>`).join('');

  $('f-h').textContent = t.foot_h; $('f-note').textContent = t.foot_note; $('f-brand').textContent = C.name + ' · ' + C.portfolio;
  $('f-mail').href = 'mailto:' + C.email; $('f-mail').textContent = C.email;
  $('f-li').href = 'https://' + C.linkedin;
  $('ph-name').textContent = C.name; $('ph-role').textContent = t.sub;
  $('ph-c').innerHTML = esc(C.email) + '<br>' + esc(C.linkedin) + '<br>' + esc(C.portfolio);
}

function loadGame(i){
  const g = C.lab[i], t = T(), scr = $('s-' + g.id);
  if (!g.embed){ $('gs-' + g.id).textContent = t.coin_soon; return; }
  scr.innerHTML = `<iframe src="${g.embed}" title="${esc(t.games[g.id].title)}" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>`;
  const card = $('g-' + g.id), fr = scr.querySelector('iframe'); let muted = false;
  card.classList.add('playing');
  const ctl = $('gs-' + g.id); ctl.className = 'gbar';
  ctl.innerHTML = `<button class="btn" data-a="mute"></button><button class="btn" data-a="full">⛶ ${esc(t.full)}</button><button class="btn" data-a="eject">⏏ ${esc(t.close)}</button><span class="soon">${esc(t.click_hint)}</span>`;
  const mb = ctl.querySelector('[data-a=mute]');
  const paint = () => mb.textContent = muted ? '🔇 ' + t.sound_on : '🔊 ' + t.mute;
  const send = () => { try{ fr.contentWindow.postMessage({type:'mute', on: muted}, '*') }catch(e){} };
  paint(); fr.addEventListener('load', send);
  mb.onclick = () => { muted = !muted; paint(); send(); fr.focus(); };
  ctl.querySelector('[data-a=full]').onclick = () => { const r = scr.requestFullscreen || scr.webkitRequestFullscreen; if (r) r.call(scr); else window.open(g.embed, '_blank'); fr.focus(); };
  ctl.querySelector('[data-a=eject]').onclick = () => render();
  fr.focus();
}

window.setLang = function(l){ L = l; try{ localStorage.setItem('lang', l) }catch(e){} render(); };
try{ const s = localStorage.getItem('lang'); L = s || ((navigator.language || '').toLowerCase().startsWith('pt') ? 'pt' : 'en') }catch(e){}
render();

if (C.analytics.goatcounter){ const s = document.createElement('script'); s.async = true; s.dataset.goatcounter = 'https://' + C.analytics.goatcounter + '.goatcounter.com/count'; s.src = '//gc.zgo.at/count.js'; document.body.appendChild(s); }
})();
</script>
