  --ink:#141413;--body-strong:#252523;--body:#3d3d3a;--muted:#6c6a64;--muted-soft:#8e8b82;
  --primary:#cc785c;--primary-active:#a9583e;--on-dark:#faf9f5;--on-dark-soft:#a09d96;
  --hairline:#e6dfd8;--hairline-soft:#ebe6df;--teal:#5db8a6;--amber:#e8a55a;
  --serif:'Lora',Georgia,serif;--sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;--maxw:1120px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{background:var(--canvas);color:var(--body);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--serif);color:var(--ink);font-weight:500;letter-spacing:-0.02em;line-height:1.12}
a{color:inherit;text-decoration:none}
.wrap{max-width:var(--maxw);margin:0 auto;padding-left:28px;padding-right:28px}
@media(max-width:560px){.wrap{padding-left:20px;padding-right:20px}}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--primary);display:inline-flex;align-items:center;gap:8px}
.spark{display:inline-block;width:13px;height:13px;flex:none}
#content{transition:opacity .18s ease}
#content.swapping{opacity:0}

/* SCROLL PROGRESS */
.progress{position:fixed;top:0;left:0;right:0;height:2px;background:var(--primary);transform-origin:0 50%;transform:scaleX(0);z-index:60;pointer-events:none}

/* NAV */
nav{position:sticky;top:0;z-index:50;background:rgba(250,249,245,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--hairline-soft);transition:box-shadow .3s ease}
nav.scrolled{box-shadow:0 10px 30px -22px rgba(20,20,19,.45)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:64px;max-width:var(--maxw);margin:0 auto;padding:0 28px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-size:19px;color:var(--ink);letter-spacing:-0.02em}
.brand .spark{color:var(--primary);transition:transform .6s var(--ease)}
.brand:hover .spark{transform:rotate(90deg) scale(1.15)}
.brand .spark.tap{animation:tap .35s var(--ease)}
@keyframes tap{50%{transform:rotate(180deg) scale(1.6)}}
.toast{position:fixed;left:16px;right:16px;margin:0 auto;width:fit-content;bottom:28px;z-index:70;transform:translateY(20px);opacity:0;pointer-events:none;
  background:var(--dark);color:var(--on-dark);font-size:14px;font-weight:500;padding:12px 20px;border-radius:9999px;
  box-shadow:0 16px 40px -16px rgba(20,20,19,.6);transition:opacity .35s ease,transform .45s var(--ease);
  display:flex;align-items:center;gap:10px}
.toast svg{width:13px;height:13px;color:var(--amber);flex:none}
.toast.show{opacity:1;transform:none}
.nav-links{display:flex;align-items:center;gap:6px}
.nav-links a{font-size:14px;font-weight:500;color:var(--muted);padding:8px 12px;border-radius:8px;transition:.15s}
.nav-links a:hover{color:var(--ink);background:var(--surface-card)}
.lang-toggle{margin-left:8px;display:inline-flex;border:1px solid var(--hairline);border-radius:9999px;overflow:hidden;background:var(--canvas)}
.lang-toggle button{font-family:var(--sans);font-size:12.5px;font-weight:600;letter-spacing:.4px;padding:6px 13px;border:0;background:transparent;color:var(--muted);cursor:pointer;transition:.15s}
.lang-toggle button.active{background:var(--ink);color:var(--on-dark)}
@media(max-width:760px){.nav-links a{display:none}.nav-inner{padding:0 20px}}

/* HERO */
.hero-shell{position:relative;isolation:isolate;overflow:hidden}
#hero-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
@media(max-width:760px){#hero-canvas{opacity:.55}}
.hero{padding-top:96px;padding-bottom:40px}
.hero h1{font-size:clamp(44px,8vw,84px);font-weight:500;letter-spacing:-0.035em;line-height:1.02;max-width:12ch;margin:20px 0 26px}
.hero h1 em{font-style:italic;color:var(--primary);position:relative;white-space:nowrap}
.hero h1 em::after{content:"";position:absolute;left:2%;right:2%;bottom:.04em;height:.06em;background:var(--primary);opacity:.35;border-radius:2px;transform-origin:left;transform:scaleX(0);animation:underline 1s var(--ease) 1s forwards}
.hero .lead{font-size:clamp(17px,2.2vw,20px);color:var(--body);max-width:60ch;line-height:1.55}
.hero .lead em{color:var(--primary-active);font-style:normal;font-weight:500}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.btn{font-family:var(--sans);font-size:14px;font-weight:600;padding:0 22px;height:46px;display:inline-flex;align-items:center;gap:8px;border-radius:8px;cursor:pointer;border:1px solid transparent;transition:background .18s,border-color .18s,transform .18s,box-shadow .18s}
.btn svg{transition:transform .25s var(--ease)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 8px 20px -12px rgba(204,120,92,.9)}
.btn-primary:hover{background:var(--primary-active);transform:translateY(-1px)}
.btn-primary:hover svg{transform:translateX(3px)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--hairline)}
.btn-ghost:hover{background:var(--surface-card);border-color:var(--cream-strong);transform:translateY(-1px)}

/* hero entrance */
.hero .eyebrow,.hero .lead,.hero-cta{animation:rise .9s var(--ease) both}
.hero .eyebrow{animation-delay:.05s}
.hero .lead{animation-delay:.55s}
.hero-cta{animation-delay:.7s}
.hero h1 .w{display:inline-block;animation:rise .9s var(--ease) both;animation-delay:calc(.15s + var(--i) * .1s)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes underline{to{transform:scaleX(1)}}

/* SCROLL REVEAL */
.js .reveal{opacity:0;transform:translateY(22px);transition:opacity .8s ease,transform .8s var(--ease),background .2s,border-color .2s,box-shadow .25s;transition-delay:calc(var(--d,0) * 80ms),calc(var(--d,0) * 80ms),0s,0s,0s}
.js .reveal.in{opacity:1;transform:none}
.no-anim .reveal,.no-anim .reveal *{transition:none!important}

/* SECTIONS */
section{padding-top:84px;padding-bottom:84px}
@media(max-width:680px){section{padding-top:56px;padding-bottom:56px}}
.sec-head{margin-bottom:40px;max-width:62ch}
.sec-head h2{font-size:clamp(28px,4vw,40px);font-weight:500;letter-spacing:-0.025em;margin:12px 0 0}
.sec-head p{margin-top:14px;color:var(--muted);font-size:16.5px}

/* KPI BAND */
.kpi-band{background:var(--surface-soft);border-top:1px solid var(--hairline-soft);border-bottom:1px solid var(--hairline-soft)}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--hairline);border:1px solid var(--hairline);border-radius:14px;overflow:hidden}
@media(max-width:780px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:460px){.kpi-grid{grid-template-columns:1fr}}
.kpi{background:var(--canvas);padding:26px 24px;display:flex;flex-direction:column;gap:6px;min-height:156px;position:relative}
.kpi:hover{background:#fff}
.kpi .num{font-family:var(--serif);font-size:42px;font-weight:500;color:var(--ink);letter-spacing:-0.03em;line-height:1;font-variant-numeric:tabular-nums}
.kpi .unit{font-size:21px;color:var(--primary);font-family:var(--serif);margin-left:2px}
.kpi .lbl{font-size:13.5px;color:var(--muted);line-height:1.45;margin-top:auto}
.kpi .ktag{font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--muted-soft)}
.kpi.dark{background:var(--dark)}
.kpi.dark .num,.kpi.dark .lbl{color:var(--on-dark)}
.kpi.dark .unit{color:var(--amber)}
.kpi.dark .ktag{color:var(--teal)}
.kpi.dark:hover{background:#1e1c1a}
.kpi.dark::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,80%) var(--my,20%),rgba(232,165,90,.16),transparent 55%);pointer-events:none;transition:opacity .3s}
.spark-line{position:absolute;right:18px;top:22px;width:46px;height:20px;opacity:.6;overflow:visible;transform-origin:right top;transition:opacity .25s,transform .35s var(--ease)}
.kpi:hover .spark-line{opacity:1;transform:scale(1.25)}
.js .spark-line polyline{stroke-dasharray:var(--len,60);stroke-dashoffset:var(--len,60);transition:stroke-dashoffset 1.3s var(--ease) .35s}
.js .kpi.in .spark-line polyline{stroke-dashoffset:0}
.spark-line circle{opacity:0;transition:opacity .3s 1.5s}
.kpi.in .spark-line circle,html:not(.js) .spark-line circle{opacity:1}

/* PROJECT CARDS */
.proj-list{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface-card);border:1px solid var(--hairline);border-radius:13px;overflow:hidden}
.card.is-live{background:var(--canvas);border-color:var(--cream-strong)}
.card:hover{border-color:var(--primary);box-shadow:0 14px 34px -26px rgba(169,88,62,.55)}
.card-head{display:flex;align-items:center;gap:18px;padding:22px 26px;cursor:pointer;width:100%;text-align:left;background:none;border:0;font-family:inherit}
.card-idx{font-family:var(--mono);font-size:12px;color:var(--muted-soft);width:28px;flex:none;transition:color .2s}
.card:hover .card-idx,.card.open .card-idx{color:var(--primary)}
.card-tt{flex:1;min-width:0}
.card-tt h3{font-size:19px;font-weight:600;letter-spacing:-0.015em;line-height:1.25}
.card-tt .sub{font-size:13.5px;color:var(--muted);margin-top:3px}
.badge{font-size:10.5px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;padding:4px 10px;border-radius:9999px;flex:none;display:inline-flex;align-items:center;gap:6px}
.badge.live{background:var(--primary);color:#fff}
.badge.live::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.badge.case{background:var(--cream-strong);color:var(--body-strong)}
.chev{width:20px;height:20px;flex:none;color:var(--muted);transition:transform .3s var(--ease)}
.card.open .chev{transform:rotate(180deg)}
.card-body{max-height:0;overflow:hidden;transition:max-height .45s var(--ease)}
.card-body-inner{padding:2px 26px 26px 72px;opacity:0;transform:translateY(-6px);transition:opacity .35s ease,transform .35s var(--ease)}
.card.open .card-body-inner{opacity:1;transform:none;transition-delay:.08s}
@media(max-width:560px){.card-body-inner{padding:2px 20px 22px 20px}.card-head{padding:18px 20px;gap:12px}.card-idx{display:none}}
.card-body p{font-size:15.5px;color:var(--body);line-height:1.65;max-width:70ch}
.card-body p a,.insight a{color:var(--primary-active);text-decoration:underline;text-underline-offset:2px;font-weight:500;transition:color .15s}
.card-body p a:hover,.insight a:hover{color:var(--primary)}
.insight{margin-top:14px;padding:14px 16px;background:var(--surface-soft);border-left:3px solid var(--primary);border-radius:0 8px 8px 0;font-size:14.5px;color:var(--body-strong)}
.card.is-live .insight{background:var(--surface-card)}
.card-meta{display:flex;flex-wrap:wrap;align-items:center;gap:18px;margin-top:18px}
.stack{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-family:var(--mono);font-size:11.5px;color:var(--body);background:var(--canvas);border:1px solid var(--hairline);padding:4px 10px;border-radius:6px}
.card.is-live .chip{background:var(--surface-soft)}
.view-link{font-size:13.5px;font-weight:600;color:var(--primary-active);display:inline-flex;align-items:center;gap:6px}
.view-link:hover{text-decoration:underline}
.view-link svg{width:14px;height:14px;transition:transform .25s var(--ease)}
.view-link:hover svg{transform:translate(2px,-2px)}

/* TIMELINE */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1.5px;background:var(--hairline)}
.js .tl::before{transform:scaleY(0);transform-origin:top;transition:transform 1.6s var(--ease) .2s}
.js .tl.in::before{transform:scaleY(1)}
.tl-item{position:relative;padding-bottom:34px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:-26px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 4px var(--canvas)}
.tl-item:first-child::after{content:"";position:absolute;left:-26px;top:5px;width:11px;height:11px;border-radius:50%;border:1.5px solid var(--primary);animation:ring 2.4s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.7}to{transform:scale(2.6);opacity:0}}
.tl-item .role{font-family:var(--serif);font-size:20px;font-weight:500;color:var(--ink)}
.tl-item .org{font-size:14.5px;color:var(--body-strong);margin-top:2px}
.tl-item .when{font-family:var(--mono);font-size:12px;color:var(--muted-soft);margin-top:4px;display:block}
.tl-note{font-size:14.5px;color:var(--muted);margin-top:10px;max-width:68ch;line-height:1.5}
.tl-item ul{list-style:none;margin-top:12px;display:flex;flex-direction:column;gap:7px}
.tl-item li{font-size:14.5px;color:var(--body);padding-left:18px;position:relative;line-height:1.55;max-width:68ch}
.tl-item li::before{content:"–";position:absolute;left:0;color:var(--primary)}

/* SKILLS + LANGUAGES */
.cols{display:grid;grid-template-columns:1.3fr 1fr;gap:48px}
@media(max-width:780px){.cols{grid-template-columns:1fr;gap:40px}}
.skill-group{margin-bottom:22px}
.skill-group h4{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:11px}
.skill-group .stack .chip{font-family:var(--sans);font-size:13px;padding:6px 13px;border-radius:9999px;background:var(--surface-card);border-color:var(--hairline);transition:background .2s,border-color .2s,color .2s,transform .2s}
.skill-group .stack .chip:hover{background:var(--canvas);border-color:var(--primary);color:var(--ink);transform:translateY(-1px)}
.lang-row{margin-bottom:16px}
.lr-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.lr-name{font-size:15px;font-weight:500;color:var(--ink)}
.lr-lvl{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.meter{height:6px;background:var(--surface-card);border-radius:9999px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--primary);border-radius:9999px}
.js .meter span{transform:scaleX(0);transform-origin:left;transition:transform 1.2s var(--ease) .25s}
.js .lang-row.in .meter span{transform:scaleX(1)}

/* EDU / CERTS */
.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px}
@media(max-width:680px){.mini-grid{grid-template-columns:1fr;gap:32px}}
.mini h4{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.ei-deg{font-family:var(--serif);font-size:18px;color:var(--ink)}
.ei-sch{font-size:14px;color:var(--body)}
.ei-when{font-family:var(--mono);font-size:12px;color:var(--muted-soft);margin-top:2px}
.certs{list-style:none;display:flex;flex-direction:column;gap:9px}
.certs li{font-size:14px;color:var(--body);padding-left:18px;position:relative}
.certs li::before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:50%;background:var(--primary)}
.certs li b{color:var(--ink);font-weight:600}

/* FOOTER */
footer{background:var(--dark);color:var(--on-dark-soft);padding:64px 0 40px;margin-top:40px;position:relative;overflow:hidden}
footer::before{content:"";position:absolute;width:520px;height:520px;right:-140px;top:-260px;border-radius:50%;background:radial-gradient(circle,rgba(204,120,92,.22),transparent 65%);animation:drift 14s ease-in-out infinite alternate;pointer-events:none}
@keyframes drift{to{transform:translate(-120px,60px)}}
.f-top{display:flex;justify-content:space-between;gap:40px;flex-wrap:wrap;position:relative}
footer h3{font-family:var(--serif);font-size:30px;color:var(--on-dark);font-weight:500;letter-spacing:-0.02em;max-width:20ch;line-height:1.18}
.f-contact{display:flex;flex-direction:column;gap:11px;font-size:14.5px}
.f-contact a{color:var(--on-dark);display:inline-flex;align-items:center;gap:9px;transition:color .15s,transform .2s}
.f-contact a:hover{color:var(--amber);transform:translateX(3px)}
.f-contact svg{width:16px;height:16px;color:var(--on-dark-soft);flex:none}
.f-bottom{margin-top:46px;padding-top:22px;border-top:1px solid var(--dark-elevated);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--muted-soft);position:relative}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
  .hero h1 em::after{transform:scaleX(1)}
  .js .reveal{opacity:1;transform:none}
  .js .tl::before,.js .meter span{transform:none}
  .js .spark-line polyline{stroke-dashoffset:0}
  .spark-line circle{opacity:1}
}
:focus-visible{outline:2px solid var(--primary);outline-offset:3px;border-radius:4px}

/* PRINT: Ctrl+P turns the site into a clean CV */
.print-head{display:none}
@media print{
  @page{size:A4;margin:11mm 13mm 10mm}
  .print-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16pt;border-bottom:1.5px solid #cc785c;padding-bottom:6pt;margin-bottom:8pt}
  .print-head .ph-name{font-family:var(--serif);font-size:20pt;color:#141413;letter-spacing:-.02em;line-height:1}
  .print-head .ph-role{font-size:9pt;color:#a9583e;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;margin-top:3pt}
  .print-head .ph-contact{font-size:8.5pt;color:#444;text-align:right;line-height:1.5}
  footer{display:none!important}
  #projetos{display:none!important}
  #competencias .cols{break-inside:avoid}
  .mini-grid{break-inside:avoid}
  .hero .eyebrow{display:none}
  .tl::before{display:none}
  *,*::before,*::after{animation:none!important;transition:none!important;box-shadow:none!important}
  html,body{background:#fff!important;font-size:9.5pt;color:#222}
  .progress,nav,#hero-canvas,.hero-cta,.toast,.chev,.badge,.spark-line,.card-idx,footer::before,.kpi-band .eyebrow,.view-link{display:none!important}
  .reveal,.js .reveal{opacity:1!important;transform:none!important}
  .js .tl::before,.js .meter span{transform:none!important}
  .wrap{max-width:none;padding:0!important}
  section{padding:0 0 10pt!important}
  .kpi-band,#competencias,#competencias+*{background:none!important;border:0!important}
  div[style*="surface-soft"]{background:none!important;border:0!important}
  .hero{padding:0 0 8pt!important}
  .hero h1{font-size:17pt;max-width:none;margin:0 0 3pt}
  .hero h1 .w{animation:none!important;opacity:1!important}
  .hero h1 em::after{display:none}
  .hero .lead{font-size:9.5pt;max-width:none;line-height:1.45}
  .hero .eyebrow,.hero .lead{animation:none!important}
  .sec-head{margin-bottom:8pt!important;max-width:none}
  .sec-head h2{font-size:15pt;margin-top:2pt}
  .sec-head p{display:none}
  .eyebrow{font-size:7.5pt}
  .kpi-band section{padding:0 0 10pt!important}
  .kpi-band .sec-head{display:none}
  .kpi-grid{grid-template-columns:repeat(3,1fr)!important;border-radius:6px}
  .kpi{min-height:0;padding:5pt 8pt;gap:2pt;background:#fff!important}
  .kpi.dark{background:#fff!important}
  .kpi.dark .num,.kpi.dark .lbl{color:#222!important}
  .kpi.dark::before{display:none}
  .kpi .num{font-size:14pt}
  .kpi .unit{font-size:11pt}
  .kpi .lbl{font-size:7.5pt;line-height:1.3}
  .proj-list{gap:4pt}
  .card,.card.is-live{background:#fff!important;border:1px solid #ddd!important;break-inside:avoid}
  .card-head{padding:5pt 9pt 1pt}
  .card-tt h3{font-size:11pt}
  .card-tt .sub{font-size:8.5pt}
  .card-body{max-height:none!important;overflow:visible}
  .card-body-inner{opacity:1!important;transform:none!important;padding:1pt 9pt 6pt!important}
  .card-body p{font-size:8.8pt;line-height:1.4;max-width:none}
  .card-body p a{color:inherit;text-decoration:none}
  .insight{font-size:8.5pt;padding:3pt 7pt;margin-top:3pt;background:#f6f3ee!important}
  .card-meta{display:none}
  .card-meta{margin-top:5pt}
  .chip{font-size:7.5pt;padding:1pt 6pt}
  .tl-item{padding-bottom:6pt;break-inside:avoid}
  .tl-item:first-child::after{display:none}
  .tl-item .role{font-size:12pt}
  .tl-item li{font-size:8.8pt;max-width:none;line-height:1.4}
  .tl-item ul{margin-top:3pt;gap:2pt}
  .tl-note{font-size:8.8pt;margin-top:3pt;max-width:none}
  .tl{padding-left:14pt}
  .tl-item::before{left:-14pt}
  .cols{grid-template-columns:1.3fr 1fr;gap:20pt}

<script>
/* RENDERER */
let L = 'en';
const C = CONFIG;
const t = k => C[L][k];
const tr = v => (v && typeof v === 'object' && 'en' in v) ? v[L] : v;
const REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function chip(c){ return `<span class="chip">${tr(c)}</span>`; }

// split a short HTML headline into word spans for the staggered entrance
function splitWords(html){
  return html.split(' ').map((w,i)=>`<span class="w" style="--i:${i}">${w}</span>`).join(' ');
}

// "R$250M+" -> {pre:"R$", n:250, post:"M+"}; returns null when not worth counting
function parseNum(s){
  const m = String(s).match(/^([^\d]*)(\d+(?:\.\d+)?)(.*)$/);
  if(!m) return null;
  const n = parseFloat(m[2]);
  return n >= 10 ? {pre:m[1], n, post:m[3]} : null;
}

function render(){
  document.documentElement.lang = L;
  document.getElementById('btn-en').classList.toggle('active', L==='en');
  document.getElementById('btn-pt').classList.toggle('active', L==='pt');

  // NAV
  document.getElementById('n-brand').textContent = C.name;

  // PRINT HEADER
  document.getElementById('ph-name').textContent  = C.name;
  document.getElementById('ph-role').textContent  = L==='pt' ? C.role_pt : C.role_en;
  document.getElementById('ph-email').textContent = C.email;
  document.getElementById('ph-li').textContent    = C.linkedin;
  document.getElementById('ph-loc').textContent   = L==='pt' ? C.location_pt : C.location_en;
  ['n-0','n-1','n-2'].forEach((id,i) => document.getElementById(id).textContent = t('nav')[i]);

  // HERO
  document.getElementById('h-tag').textContent  = t('hero_tag');
  document.getElementById('h-h1').innerHTML     = splitWords(t('hero_h1'));
  document.getElementById('h-lead').innerHTML   = t('hero_lead');
  document.getElementById('h-cta1').textContent = t('cta_proj');
  const cta2 = document.getElementById('h-cta2');
  cta2.textContent = t('cta_li');
  cta2.href = 'https://' + C.linkedin;

  // KPI
  document.getElementById('kpi-tag').textContent = t('kpi_tag');
  document.getElementById('kpi-h2').textContent  = t('kpi_h2');
  document.getElementById('kpi-grid').innerHTML  = C.kpis.map((k,i)=>{
    const num = tr(k.num);
    const pn = parseNum(num);
    const last = k.sparkline ? k.sparkline.trim().split(' ').pop().split(',') : null;
    const col = k.teal ? 'var(--teal)' : 'var(--primary)';
    const sp = k.sparkline ? `<svg class="spark-line" viewBox="0 0 46 20"><polyline points="${k.sparkline}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="2" fill="${col}"/></svg>` : '';
    const countAttr = pn ? ` data-count="${pn.n}" data-pre="${pn.pre}" data-post="${pn.post}"` : '';
    return `<div class="kpi reveal${k.dark?' dark':''}" style="--d:${i}">
      ${sp}
      <span class="ktag">${tr(k.tag)}</span>
      <span class="num"><span class="nv"${countAttr}>${num}</span><span class="unit">${tr(k.unit)}</span></span>
      <span class="lbl">${k[L]}</span>
    </div>`;
  }).join('');

  // PROJECTS
  document.getElementById('p-tag').textContent = t('proj_tag');
  document.getElementById('p-h2').textContent  = t('proj_h2');
  document.getElementById('p-sub').textContent = t('proj_sub');
  document.getElementById('proj-list').innerHTML = C.projects.map((p,i)=>{
    const d = p[L];
    const chips = p.stack.map(chip).join('');
    const link = p.url ? `<a class="view-link" href="${p.url}" target="_blank" rel="noopener">${t('view_dash')} <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M9 7h8v8"/></svg></a>` : '';
    const bdg = p.live ? `<span class="badge live">${t('badge_live')}</span>` : `<span class="badge case">${t('badge_case')}</span>`;
    return `<div class="card reveal${p.live?' is-live':''}" data-i="${i}" style="--d:${i}">
      <button class="card-head" aria-expanded="false" onclick="toggleCard(${i})">
        <span class="card-idx">${p.idx}</span>
        <span class="card-tt"><h3>${d.title}</h3><div class="sub">${d.sub}</div></span>
        ${bdg}
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="card-body" id="cb-${i}">
        <div class="card-body-inner">
          <p>${d.body}</p>
          <div class="insight">${d.insight}</div>
          <div class="card-meta"><div class="stack">${chips}</div>${link}</div>
        </div>
      </div>
    </div>`;
  }).join('');

  // EXPERIENCE
  document.getElementById('e-tag').textContent = t('exp_tag');
  document.getElementById('e-h2').textContent  = t('exp_h2');
  document.getElementById('tl').innerHTML = C.experience.map((e,i)=>{
    const d = e[L];
    const bullets = d.bullets.map(b=>`<li>${b}</li>`).join('');
    return `<div class="tl-item reveal" style="--d:${i}">
      <div class="role">${d.role}</div>
      <div class="org">${d.org}</div>
      <span class="when">${e['date_'+L]}</span>
      ${d.note ? `<p class="tl-note">${d.note}</p>` : ''}
      <ul>${bullets}</ul>
    </div>`;
  }).join('');

  // SKILLS
  document.getElementById('sk-tag').textContent = t('skills_tag');
  document.getElementById('sk-h2').textContent  = t('skills_h2');
  document.getElementById('skill-groups').innerHTML = C.skills.map((g,i)=>`
    <div class="skill-group reveal" style="--d:${i}">
      <h4>${g[L]}</h4>
      <div class="stack">${g.chips.map(chip).join('')}</div>
    </div>`).join('');

  // LANGUAGES
  document.getElementById('lg-tag').textContent = t('lang_tag');
  document.getElementById('lg-h2').textContent  = t('lang_h2');
  document.getElementById('lang-rows').innerHTML = C.languages.map((l,i)=>`
    <div class="lang-row reveal" style="--d:${i}">
      <div class="lr-top"><span class="lr-name">${l[L]}</span><span class="lr-lvl">${l['level_'+L]}</span></div>
      <div class="meter"><span style="width:${l.pct}%"></span></div>
    </div>`).join('');

  // EDUCATION
  document.getElementById('edu-tag').textContent  = t('edu_tag');
  document.getElementById('edu-deg').textContent  = C.education[L].degree;
  document.getElementById('edu-sch').textContent  = C.education.school;
  document.getElementById('edu-when').textContent = C.education[L].period;
  document.getElementById('edu-award').textContent = C.education['award_'+L];
  document.getElementById('intl-tag').textContent  = t('intl_tag');
  document.getElementById('intl-place').textContent = C.intl.place;
  document.getElementById('intl-text').textContent  = C.intl[L].text;
  document.getElementById('intl-when').textContent  = C.intl[L].period;

  // CERTS
  document.getElementById('cert-tag').textContent = t('cert_tag');
  document.getElementById('cert-list').innerHTML = C.certs.map(c=>`
    <li><b>${tr(c.bold)}</b> ${c.rest}</li>`).join('');

  // FOOTER
  document.getElementById('foot-h').textContent    = t('foot_h');
  document.getElementById('foot-note').textContent = t('foot_note');
  document.getElementById('foot-loc').textContent  = L==='pt' ? C.location_pt : C.location_en;
  document.getElementById('foot-brand').textContent = `${C.name} · ${L==='pt' ? C.role_pt : C.role_en}`;
  const ea = document.getElementById('foot-email');
  ea.href = 'mailto:'+C.email; ea.querySelector('span').textContent = C.email;
  const la = document.getElementById('foot-li');
  la.href = 'https://'+C.linkedin; la.querySelector('span').textContent = C.linkedin;

  document.querySelectorAll('.spark-line polyline').forEach(pl=>pl.style.setProperty('--len', Math.ceil(pl.getTotalLength()) + 2));
  bindKpis();
}

/* ---------- MOTION ---------- */

// count a KPI number up from zero
function countUp(el){
  if(!el || el.dataset.done) return;
  el.dataset.done = '1';
  const target = parseFloat(el.dataset.count), pre = el.dataset.pre, post = el.dataset.post;
  if(REDUCE){ el.textContent = pre + target + post; return; }
  const dur = 1400, t0 = performance.now();
  (function step(now){
    const p = Math.min((now - t0) / dur, 1);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = pre + Math.round(target * e) + post;
    if(p < 1) requestAnimationFrame(step);
  })(t0);
}

// reveal elements as they scroll into view
const io = ('IntersectionObserver' in window) ? new IntersectionObserver(entries=>{
  entries.forEach(en=>{
    if(!en.isIntersecting) return;
    const el = en.target;
    el.classList.add('in');
    el.querySelectorAll('[data-count]').forEach(n=>setTimeout(()=>countUp(n), 150));
    io.unobserve(el);
  });
}, {threshold:0.15, rootMargin:'0px 0px -40px 0px'}) : null;

function observeReveals(){
  const els = document.querySelectorAll('.reveal:not(.in), .reveal-line:not(.in)');
  if(!io){ els.forEach(el=>{ el.classList.add('in'); el.querySelectorAll('[data-count]').forEach(countUp); }); return; }
  els.forEach(el=>io.observe(el));
}

// after a language switch: show everything at its final state, no replay
function settleAll(){
  document.body.classList.add('no-anim');
  document.querySelectorAll('.reveal, .reveal-line').forEach(el=>{ el.classList.add('in'); io && io.unobserve(el); });
  document.querySelectorAll('[data-count]').forEach(n=>{ n.dataset.done='1'; n.textContent = n.dataset.pre + n.dataset.count + n.dataset.post; });
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.remove('no-anim')));
}

// KPI tiles: sparkline redraws on hover; amber glow follows the cursor on the dark tile
function bindKpis(){
  document.querySelectorAll('.kpi').forEach(k=>{
    const line = k.querySelector('.spark-line polyline');
    if(!line || REDUCE) return;
    k.addEventListener('pointerenter', ()=>{
      if(!k.classList.contains('in')) return;
      line.style.transition = 'none'; line.style.strokeDashoffset = line.style.getPropertyValue('--len');
      line.getBoundingClientRect();
      line.style.transition = 'stroke-dashoffset .9s cubic-bezier(.2,.7,.2,1)'; line.style.strokeDashoffset = '0';
    });
  });
  document.querySelectorAll('.kpi.dark').forEach(k=>{
    k.addEventListener('pointermove', e=>{
      const r = k.getBoundingClientRect();
      k.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%');
      k.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100) + '%');
    });
  });
}

// scroll progress bar + nav shadow
(function(){
  const bar = document.getElementById('progress'), nav = document.getElementById('nav');
  let ticking = false;
  function update(){
    const h = document.documentElement.scrollHeight - innerHeight;
    bar.style.transform = `scaleX(${h > 0 ? scrollY / h : 0})`;
    nav.classList.toggle('scrolled', scrollY > 8);
    ticking = false;
  }
  addEventListener('scroll', ()=>{ if(!ticking){ ticking = true; requestAnimationFrame(update); } }, {passive:true});
  update();
})();

// hero background: a quiet field of data points that breathes and leans toward the cursor.
// Easter egg: window.heroChart() lines the points up into a bar chart with a trend line.
(function(){
  const cv = document.getElementById('hero-canvas'), shell = document.getElementById('hero-shell');
  if(!cv || !cv.getContext) return;
  const ctx = cv.getContext('2d');
  const GAP = 26, R = 150;
  let w = 0, h = 0, cols = 0, rows = 0, dots = [], mask = null;
  let mx = -1e4, my = -1e4, tmx = -1e4, tmy = -1e4, running = false, raf = 0;
  let chart = null;

  const clamp = v => v < 0 ? 0 : v > 1 ? 1 : v;
  const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };
  const ease = p => 1 - Math.pow(1 - p, 3);

  function size(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = cv.getBoundingClientRect();
    w = r.width; h = r.height;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dots = []; cols = 0; rows = 0;
    for(let y = GAP / 2; y < h; y += GAP){ rows++; cols = 0; for(let x = GAP / 2; x < w; x += GAP){ dots.push(x, y); cols++; } }
    // soft elliptical mask, densest top-right, fading toward the text
    const mobile = w < 760;
    mask = new Float32Array(dots.length / 2);
    for(let i = 0; i < mask.length; i++){
      const x = dots[i * 2] / w, y = dots[i * 2 + 1] / h;
      const dn = mobile ? Math.hypot((x - .5) / .9, (y - .5) / .9)
                        : Math.hypot((x - .82) / .65, (y - .42) / .85);
      mask[i] = 1 - smooth(.25, .72, dn);
    }
    chart = null;
  }

  function buildChart(){
    const vals = [.24, .32, .28, .44, .39, .56, .51, .7, .66, .84, 1];
    // start the chart to the right of the text when there is room; otherwise use the full width
    const lead = document.getElementById('h-lead').getBoundingClientRect(), box = cv.getBoundingClientRect();
    const cEnd = cols - 2;
    let c0 = Math.ceil((lead.right - box.left + 24) / GAP);
    let behindText = false;
    if(cEnd - c0 + 1 < 12){ c0 = Math.max(1, Math.floor(cols * .06)); behindText = true; }
    const n = Math.min(vals.length, Math.floor((cEnd - c0 + 1) / 3));
    const v = vals.slice(vals.length - n);
    const base = Math.round(rows * .84), maxH = Math.max(3, Math.round(rows * .62));
    const delay = new Float32Array(dots.length / 2).fill(-1);
    const line = [];
    let maxDelay = 0;
    for(let b = 0; b < n; b++){
      const c = c0 + b * 3, hgt = Math.max(1, Math.round(v[b] * maxH));
      for(let cc = c; cc < c + 2; cc++) for(let k = 0; k < hgt; k++){
        const rr = base - k; if(rr < 0) continue;
        const d = b * 85 + k * 32; delay[rr * cols + cc] = d; if(d > maxDelay) maxDelay = d;
      }
      line.push([(c + 1) * GAP, (base - hgt + .5) * GAP - GAP * .55]);
    }
    if(behindText) line.length = 0; // narrow screens: bars only, no line across the text
    const inEnd = maxDelay + 500;
    return { t0: null, delay, line, lineAt: inEnd - 150, outAt: inEnd + 2900, end: inEnd + 3700 };
  }

  function draw(time){
    mx += (tmx - mx) * 0.12; my += (tmy - my) * 0.12;
    ctx.clearRect(0, 0, w, h);

    let e = 0, out = 1, dim = 0;
    if(chart){
      if(chart.t0 === null) chart.t0 = time;
      e = REDUCE ? chart.lineAt + 2000 : time - chart.t0;
      out = 1 - clamp((e - chart.outAt) / (chart.end - chart.outAt));
      dim = ease(clamp(e / 500)) * out;
      if(!REDUCE && e > chart.end) chart = null;
    }

    for(let i = 0, j = 0; i < dots.length; i += 2, j++){
      const x = dots[i], y = dots[i + 1];
      const wave = (Math.sin(x * 0.011 + time * 0.0006) + Math.cos(y * 0.017 - time * 0.00045) + 2) / 4; // 0..1
      let a = (0.07 + 0.16 * wave) * mask[j], r = 1 + 0.7 * wave, near = 0, ox = 0, oy = 0, lit = 0;

      if(chart){
        const d = chart.delay[j];
        if(d >= 0){
          lit = ease(clamp((e - d) / 420)) * out;
          a = a * (1 - lit) + 0.88 * lit;
          r = r * (1 - lit) + 2.4 * lit;
          oy = GAP * 1.2 * (1 - lit) * (lit > 0 ? 1 : 0);
        } else {
          a *= 1 - 0.8 * dim;
        }
      }

      const dx = x - mx, dy = y - my, dist = Math.sqrt(dx * dx + dy * dy);
      if(dist < R){
        near = 1 - dist / R; near *= near;
        a += 0.6 * near * Math.max(mask[j], lit); r += 1.6 * near;
        ox = -dx * near * 0.18; oy += -dy * near * 0.18;
      }
      if(a < 0.01) continue;
      ctx.fillStyle = (near > 0.04 || lit > 0.05) ? `rgba(204,120,92,${a})` : `rgba(20,20,19,${a})`;
      ctx.beginPath(); ctx.arc(x + ox, y + oy, r, 0, 6.283); ctx.fill();
    }

    // trend line over the bars
    if(chart && chart.line.length > 1){
      const lp = ease(clamp((e - chart.lineAt) / 900)) * out;
      if(lp > 0){
        const pts = chart.line;
        let len = 0; for(let k = 1; k < pts.length; k++) len += Math.hypot(pts[k][0] - pts[k-1][0], pts[k][1] - pts[k-1][1]);
        const drawn = len * ease(clamp((e - chart.lineAt) / 900));
        ctx.save();
        ctx.globalAlpha = out;
        ctx.strokeStyle = '#141413'; ctx.lineWidth = 1.8; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
        ctx.setLineDash([drawn, len + 1]);
        ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
        for(let k = 1; k < pts.length; k++) ctx.lineTo(pts[k][0], pts[k][1]);
        ctx.stroke();
        ctx.setLineDash([]);
        if(drawn >= len - 1){
          const [ex, ey] = pts[pts.length - 1];
          ctx.fillStyle = '#cc785c';
          ctx.beginPath(); ctx.arc(ex, ey, 4.5, 0, 6.283); ctx.fill();
          ctx.strokeStyle = 'rgba(204,120,92,.35)'; ctx.lineWidth = 6;
          ctx.beginPath(); ctx.arc(ex, ey, 9 + 3 * Math.sin(time * 0.006), 0, 6.283); ctx.stroke();
        }
        ctx.restore();
      }
    }

    if(running) raf = requestAnimationFrame(draw);
  }

  function start(){ if(running || REDUCE) return; running = true; raf = requestAnimationFrame(draw); }
  function stop(){ running = false; cancelAnimationFrame(raf); }

  window.heroChart = function(){
    if(!w) return;
    chart = buildChart();
    if(REDUCE){
      draw(0);
      setTimeout(()=>{ chart = null; draw(0); }, 4000);
    } else start();
  };

  size();
  if(REDUCE){ draw(0); }
  else {
    shell.addEventListener('pointermove', e=>{
      const r = cv.getBoundingClientRect(); tmx = e.clientX - r.left; tmy = e.clientY - r.top;
    });
    shell.addEventListener('pointerleave', ()=>{ tmx = tmy = -1e4; });
    if('IntersectionObserver' in window){
      new IntersectionObserver(([en])=> en.isIntersecting ? start() : stop()).observe(shell);
    } else start();
    document.addEventListener('visibilitychange', ()=> document.hidden ? stop() : start());
  }
  // re-measure whenever the hero changes size (window resize, web fonts loading, language switch)
  let rt;
  const resized = ()=>{ clearTimeout(rt); rt = setTimeout(()=>{ size(); if(!running) draw(0); }, 120); };
  if('ResizeObserver' in window) new ResizeObserver(resized).observe(shell);
  else addEventListener('resize', resized);
})();

function setLang(l){
  if(l === L) return;
  const content = document.getElementById('content');
  const openCards = [...document.querySelectorAll('.card.open')].map(c=>c.dataset.i);
  const swap = ()=>{
    L = l;
    render();
    settleAll();
    openCards.forEach(i => {
      const card = document.querySelector(`.card[data-i="${i}"]`);
      const body = document.getElementById('cb-'+i);
      if(card && body){ card.classList.add('open'); body.style.maxHeight = body.scrollHeight+'px'; }
    });
    content.classList.remove('swapping');
  };
  if(REDUCE){ swap(); return; }
  content.classList.add('swapping');
  setTimeout(swap, 180);
}

function toggleCard(i){
  const card = document.querySelector(`.card[data-i="${i}"]`);
  const body = document.getElementById('cb-'+i);
  const open = card.classList.toggle('open');
  card.querySelector('.card-head').setAttribute('aria-expanded', open);
  body.style.maxHeight = open ? body.scrollHeight+'px' : '0';
}

render();
observeReveals();

addEventListener('beforeprint', settleAll);

  let clicks = 0, timer = 0, toastTimer = 0;
  brand.addEventListener('click', ()=>{
    spark.classList.remove('tap'); void spark.offsetWidth; spark.classList.add('tap');
    clicks++; clearTimeout(timer); timer = setTimeout(()=>clicks = 0, 1600);
    if(clicks < 5) return;
    clicks = 0;
    setTimeout(()=>{
      window.heroChart && window.heroChart();
      setTimeout(()=>{
        toast.innerHTML = '<svg viewBox="0 0 16 16" fill="currentColor"><use href="#sp"/></svg>' + t('egg_toast');
        toast.classList.add('show');
        clearTimeout(toastTimer); toastTimer = setTimeout(()=>toast.classList.remove('show'), 3600);
      }, 1500);
    }, scrollY > 80 ? 650 : 0);
  });
})();
